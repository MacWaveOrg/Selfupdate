# MacWave 自更新数据 —— 唯一的入口文件。
#
# 客户端（install.sh / wave selfupdate）只读这一个文件就知道该装哪个版本、
# 该从哪个分支取代码。它每次发版都变，所以与按版本冻结的 update_commands.sh 分开。
#
#   macwavedata/latest.toml                  哪个版本是最新的
#   macwavedata/<版本>/update_commands.sh    那个版本具体怎么装
#
# 字段与 MacWave 仓库的 lib/domains.py 是配套约定：改字段名要两边一起改。
#
# version       这次要装 / 升到的版本
# release_date  发布日期（YYYY-MM-DD）
# build_number  构建号：距 2026-01-01 的天数（3 位）+ 渠道/周几字母 + HHMM
#               正式版 A-G（周一-Sun）、H 特殊日期；Beta I-O/P；RC 固定 R
# branch        MacWave 仓库里配套的代码分支；代码与版本号必须对应同一个版本
#
# update_commands_sha256  4.4 起：钉住即将被 bash 执行的那份脚本。
#               客户端不符时只警告，MACWAVE_STRICT_HASHES=1 才失败。
#
# RC 渠道读的是 rcdata/latest.toml，不是这个文件。

version = "4.6.0"
release_date = "2026-11-24"
build_number = "328B1519"
branch = "4.6"
update_commands_sha256 = "dbdfcacbfd52996a29bf316f9dfe3defe252b485ba78c880c971ee772cf2060c"
